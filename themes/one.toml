name = "One Dark / One Light (Atom)"
source = "https://github.com/atom/atom/tree/master/packages/one-dark-syntax"
source_urls = ["https://github.com/atom/atom/tree/master/packages/one-dark-syntax", "https://raw.githubusercontent.com/atom/atom/master/packages/one-dark-syntax/styles/colors.less", "https://raw.githubusercontent.com/atom/atom/master/packages/one-light-syntax/styles/colors.less", "https://raw.githubusercontent.com/atom/atom/master/LICENSE.md"]
license = "MIT, Copyright (c) 2011-2022 GitHub Inc. (Atom; the palette is published as hsl() values and converted to hex here)"
# Names are the Less variables of colors.less: mono-1..3 greys, hue-1 cyan, hue-2 blue, hue-3 purple, hue-4 green, hue-5 red 1, hue-5-2 red 2, hue-6 orange 1, hue-6-2 orange 2, bg = hsl(@syntax-hue, @syntax-saturation, @syntax-brightness) (@syntax-bg).
# Atom publishes these as hsl() values; each was converted to hex here (dark bg hsl(220,13%,18%), light bg hsl(230,1%,98%)).

[variants.dark]
mode = "dark"
primary = "#61afef"                     # hue-2
on_primary = "#282c34"                  # bg
primary_container = "#39536c"           # derived: mix(bg #282c34, hue-2 #61afef, 0.3)
on_primary_container = "#c0c5cf"        # derived: mono-1 #abb2bf moved 0.25 toward white for contrast >= 4.5
secondary = "#c678dd"                   # hue-3
on_secondary = "#282c34"                # bg
secondary_container = "#574367"         # derived: mix(bg #282c34, hue-3 #c678dd, 0.3)
on_secondary_container = "#b8bec9"      # derived: mono-1 #abb2bf moved 0.15 toward white for contrast >= 4.5
tertiary = "#56b6c2"                    # hue-1
on_tertiary = "#282c34"                 # bg
error = "#e06c75"                       # hue-5
on_error = "#262a31"                    # derived: bg #282c34 moved 0.05 toward black for contrast >= 4.5
error_container = "#5f3f48"             # derived: mix(bg #282c34, hue-5 #e06c75, 0.3)
on_error_container = "#b3bac5"          # derived: mono-1 #abb2bf moved 0.10 toward white for contrast >= 4.5
surface = "#282c34"                     # bg
on_surface = "#abb2bf"                  # mono-1
on_surface_variant = "#8c93a1"          # derived: mix(mono-1 #abb2bf, mono-2 #828997, 0.750); mono-2 alone is only 3.98:1
surface_container = "#353a43"           # derived: mix(bg #282c34, mono-3 #5c6370, 0.25)
surface_container_high = "#424852"      # derived: mix(bg #282c34, mono-3 #5c6370, 0.5)
surface_container_highest = "#5c6370"   # mono-3
outline = "#828997"                     # mono-2
outline_variant = "#5c6370"             # mono-3
derived = ["primary_container", "secondary_container", "error_container", "on_surface_variant", "on_error", "on_primary_container", "on_secondary_container", "on_error_container", "surface_container", "surface_container_high"]

[variants.light]
mode = "light"
primary = "#4078f2"                     # hue-2
on_primary = "#141417"                  # derived: mono-1 #383a42 moved 0.65 toward black for contrast >= 4.5
primary_container = "#ccdaf8"           # derived: mix(bg #fafafa, hue-2 #4078f2, 0.25)
on_primary_container = "#383a42"        # mono-1
secondary = "#a626a4"                   # hue-3
on_secondary = "#fafafa"                # bg
secondary_container = "#e5c5e4"         # derived: mix(bg #fafafa, hue-3 #a626a4, 0.25)
on_secondary_container = "#383a42"      # mono-1
tertiary = "#0184bc"                    # hue-1
on_tertiary = "#111114"                 # derived: mono-1 #383a42 moved 0.70 toward black for contrast >= 4.5
error = "#ca1243"                       # hue-5-2
on_error = "#fafafa"                    # bg
error_container = "#eec0cc"             # derived: mix(bg #fafafa, hue-5-2 #ca1243, 0.25)
on_error_container = "#383a42"          # mono-1
surface = "#fafafa"                     # bg
on_surface = "#383a42"                  # mono-1
on_surface_variant = "#696c77"          # mono-2
surface_container = "#e8e8e9"           # derived: mix(bg #fafafa, mono-3 #a0a1a7, 0.2)
surface_container_high = "#d6d6d9"      # derived: mix(bg #fafafa, mono-3 #a0a1a7, 0.4)
surface_container_highest = "#c4c5c8"   # derived: mix(bg #fafafa, mono-3 #a0a1a7, 0.6)
outline = "#a0a1a7"                     # mono-3
outline_variant = "#c4c5c8"             # derived: mix(bg #fafafa, mono-3 #a0a1a7, 0.6)
derived = ["primary_container", "secondary_container", "error_container", "on_primary", "on_tertiary", "surface_container", "surface_container_high", "surface_container_highest", "outline_variant"]
